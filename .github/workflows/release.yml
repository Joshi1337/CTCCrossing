name: Test and release

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'lib/**'
      - 'release/**'
      - 'scripts/**'
      - 'Info.json'
      - 'settings.json'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctccrossing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Run logic and Harmony integration tests
        shell: pwsh
        run: |
          dotnet run --project Source/Tests/Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Verify prepared binary matches source
        shell: pwsh
        run: ./scripts/Verify-Release.ps1

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package verified mod
        shell: pwsh
        run: ./scripts/Package-Release.ps1
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/Create-GitHubRelease.ps1

